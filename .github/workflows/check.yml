name: OpenWrt package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: python3 -m unittest discover -s tests -v
      - run: node --check package/luci-app-vlmcsd/htdocs/luci-static/resources/view/vlmcsd/overview.js
      - run: shellcheck -S error scripts/*.sh package/vlmcsd/files/vlmcsd-helper package/vlmcsd/files/vlmcsd.init
